<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Aura Player — Shared Music</title>
  <meta name="description" content="Open and listen to shared songs and playlists on Aura Player. Zero subscriptions, zero ads, 100% private.">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='50' fill='%231B154C'/><polygon points='40,30 75,50 40,70' fill='%23FFFFFF'/></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0D0D11;
      --surface: rgba(255, 255, 255, 0.04);
      --surface-elevated: rgba(255, 255, 255, 0.08);
      --surface-border: rgba(255, 255, 255, 0.12);
      --primary: #7B6BE4;
      --primary-glow: rgba(123, 107, 228, 0.4);
      --coral: #ED5564;
      --coral-glow: rgba(237, 85, 100, 0.35);
      --text: #F5F5FA;
      --text-muted: #8E8EA8;
      --text-dim: #60607A;
      --green: #34D399;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px 60px;
      position: relative;
    }

    /* Ambient aura glows */
    .glow-1 {
      position: fixed;
      top: -120px;
      left: 50%;
      transform: translateX(-50%);
      width: 600px;
      height: 600px;
      border-radius: 50%;
      background: radial-gradient(circle, var(--primary-glow) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }
    .glow-2 {
      position: fixed;
      bottom: -150px;
      right: -100px;
      width: 500px;
      height: 500px;
      border-radius: 50%;
      background: radial-gradient(circle, var(--coral-glow) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    .container {
      width: 100%;
      max-width: 620px;
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* App Header */
    .brand-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 6px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
      color: var(--text);
    }
    .brand-logo {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      background: linear-gradient(135deg, #1B154C, #5A47B8);
      border: 1px solid rgba(255, 255, 255, 0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 16px var(--primary-glow);
    }
    .brand-logo svg {
      width: 20px;
      height: 20px;
      fill: #fff;
    }
    .brand-name {
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 700;
      font-size: 19px;
      letter-spacing: -0.5px;
    }
    .brand-badge {
      font-size: 11px;
      font-weight: 700;
      color: var(--green);
      background: rgba(52, 211, 153, 0.15);
      border: 1px solid rgba(52, 211, 153, 0.3);
      padding: 4px 10px;
      border-radius: 20px;
    }

    /* Main Card */
    .card {
      background: var(--surface);
      border: 1px solid var(--surface-border);
      border-radius: 24px;
      padding: 28px 24px;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.4);
    }

    .playlist-header {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 12px;
      margin-bottom: 24px;
    }

    .playlist-artwork {
      width: 140px;
      height: 140px;
      border-radius: 20px;
      background: linear-gradient(135deg, #3D328C, #1B154C);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 12px 32px var(--primary-glow);
      border: 1px solid rgba(255, 255, 255, 0.15);
      overflow: hidden;
    }
    .playlist-artwork img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .playlist-artwork svg {
      width: 56px;
      height: 56px;
      fill: var(--primary);
    }

    .playlist-title {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 24px;
      font-weight: 700;
      line-height: 1.2;
    }
    .playlist-meta {
      font-size: 13px;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* Actions */
    .actions-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 24px;
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 16px 20px;
      border-radius: 16px;
      font-weight: 700;
      font-size: 15px;
      text-decoration: none;
      transition: all 0.2s ease;
      cursor: pointer;
      border: none;
      width: 100%;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--coral), var(--primary));
      color: #fff;
      box-shadow: 0 8px 24px var(--coral-glow);
    }
    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 28px var(--coral-glow);
    }

    .btn-secondary {
      background: var(--surface-elevated);
      color: var(--text);
      border: 1px solid var(--surface-border);
    }
    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.12);
    }

    /* Tracklist */
    .tracklist-title {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      color: var(--text-dim);
      margin-bottom: 12px;
      padding-left: 4px;
    }

    .tracklist {
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 420px;
      overflow-y: auto;
      padding-right: 4px;
    }

    .tracklist::-webkit-scrollbar {
      width: 4px;
    }
    .tracklist::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.15);
      border-radius: 4px;
    }

    .track-row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 14px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(255, 255, 255, 0.04);
      transition: all 0.15s ease;
    }
    .track-row:hover {
      background: rgba(255, 255, 255, 0.06);
    }
    .track-num {
      font-size: 13px;
      font-weight: 700;
      color: var(--text-dim);
      width: 22px;
      text-align: right;
    }
    .track-info {
      flex: 1;
      min-width: 0;
    }
    .track-name {
      font-size: 14px;
      font-weight: 600;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .track-artist {
      font-size: 12px;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .track-play-btn {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      text-decoration: none;
      transition: all 0.15s ease;
      flex-shrink: 0;
    }
    .track-play-btn:hover {
      background: var(--primary);
      transform: scale(1.08);
    }
    .track-play-btn svg {
      width: 14px;
      height: 14px;
      fill: currentColor;
    }

    /* App Promotion Banner */
    .promo-card {
      background: linear-gradient(135deg, rgba(123, 107, 228, 0.12), rgba(237, 85, 100, 0.08));
      border: 1px solid rgba(123, 107, 228, 0.25);
      border-radius: 20px;
      padding: 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }
    .promo-text h4 {
      font-size: 15px;
      font-weight: 700;
      margin-bottom: 4px;
    }
    .promo-text p {
      font-size: 12px;
      color: var(--text-muted);
    }
    .promo-btn {
      padding: 10px 18px;
      border-radius: 12px;
      background: #fff;
      color: #0D0D11;
      font-size: 13px;
      font-weight: 700;
      text-decoration: none;
      white-space: nowrap;
      box-shadow: 0 4px 12px rgba(255, 255, 255, 0.2);
    }

    /* Toast Notification */
    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: rgba(20, 20, 28, 0.95);
      border: 1px solid var(--primary);
      color: #fff;
      padding: 12px 24px;
      border-radius: 30px;
      font-size: 14px;
      font-weight: 600;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 100;
      opacity: 0;
      pointer-events: none;
    }
    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    /* Empty state */
    .empty-state {
      text-align: center;
      padding: 40px 20px;
    }
    .empty-icon {
      font-size: 48px;
      margin-bottom: 12px;
    }

    footer {
      text-align: center;
      font-size: 12px;
      color: var(--text-dim);
      margin-top: 10px;
    }
    footer a {
      color: var(--text-muted);
      text-decoration: none;
    }

    @media (max-width: 480px) {
      .card { padding: 20px 16px; }
      .promo-card { flex-direction: column; text-align: center; }
      .promo-btn { width: 100%; text-align: center; }
    }
  </style>
</head>
<body>
  <div class="glow-1"></div>
  <div class="glow-2"></div>

  <div class="container">
    <!-- Brand Header -->
    <header class="brand-header">
      <a href="index.html" class="brand">
        <div class="brand-logo">
          <svg viewBox="0 0 24 24"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg>
        </div>
        <span class="brand-name">Aura Player</span>
      </a>
      <span class="brand-badge">Cross-Platform Sync</span>
    </header>

    <!-- Main Shared Content Card -->
    <main class="card" id="main-card">
      <div id="content-container">
        <!-- Dynamically rendered by JavaScript -->
        <div class="empty-state">
          <div class="empty-icon">🎵</div>
          <h3>Reading Shared Music...</h3>
          <p style="color: var(--text-muted); margin-top: 6px; font-size: 13px;">Decrypting shared tracks from link</p>
        </div>
      </div>
    </main>

    <!-- App Install Banner -->
    <div class="promo-card">
      <div class="promo-text">
        <h4>Get Aura Player for Android & iOS</h4>
        <p>Zero monthly subscription • Zero ads • 100% Privacy</p>
      </div>
      <a href="index.html" class="promo-btn">Get App Free</a>
    </div>

    <footer>
      Designed & Developed by <b>Manikanta Amara</b> • <a href="index.html">Aura Player</a>
    </footer>
  </div>

  <div class="toast" id="toast">Copied to clipboard!</div>

  <script>
    // Universal URL-safe Base64 decoder with UTF-8 support and truncated recovery
    function decodePayload(b64) {
      if (!b64 || typeof b64 !== "string") return null;
      try {
        let raw = b64.trim();
        // 1. Convert spaces back to + (URLSearchParams and URL decoding turn + into space)
        raw = raw.replace(/\s+/g, "+");
        // 2. Convert URL-safe base64 to standard base64
        let clean = raw.replace(/-/g, "+").replace(/_/g, "/");
        // 3. Strip any trailing non-base64 characters
        clean = clean.replace(/[^A-Za-z0-9+/=]/g, "");
        // 4. Fix padding
        while (clean.length % 4 !== 0) {
          clean += "=";
        }
        const binary = atob(clean);
        const bytes = new Uint8Array(binary.length);
        for (let i = 0; i < binary.length; i++) {
          bytes[i] = binary.charCodeAt(i);
        }
        const decoded = new TextDecoder("utf-8").decode(bytes);
        try {
          return JSON.parse(decoded);
        } catch (parseErr) {
          // If there is trailing whitespace or non-JSON characters after closing brace
          const firstBrace = decoded.indexOf('{');
          const lastBrace = decoded.lastIndexOf('}');
          if (firstBrace >= 0 && lastBrace > firstBrace) {
            return JSON.parse(decoded.substring(firstBrace, lastBrace + 1));
          }
          throw parseErr;
        }
      } catch (e) {
        console.warn("Direct parse failed, attempting partial/recovery parsing", e);
        try {
          let raw = b64.trim().replace(/\s+/g, "+").replace(/-/g, "+").replace(/_/g, "/");
          raw = raw.replace(/[^A-Za-z0-9+/]/g, "");
          const validLen = raw.length - (raw.length % 4);
          let sub = raw.substring(0, validLen);
          while (sub.length % 4 !== 0) { sub += "="; }
          const binary = atob(sub);
          const bytes = new Uint8Array(binary.length);
          for (let i = 0; i < binary.length; i++) {
            bytes[i] = binary.charCodeAt(i);
          }
          let text = new TextDecoder("utf-8", { fatal: false }).decode(bytes);
          if (text.includes('"tracks":[')) {
            const tracksIdx = text.indexOf('"tracks":[');
            const subTracks = text.substring(tracksIdx);
            const lastObjEnd = subTracks.lastIndexOf("}");
            if (lastObjEnd > 0) {
              const repaired = text.substring(0, tracksIdx + lastObjEnd + 1) + "]}";
              return JSON.parse(repaired);
            }
          }
        } catch (recoverErr) {
          console.error("Recovery also failed", recoverErr);
        }
        return null;
      }
    }

    function getRawPayloadString() {
      const href = window.location.href;
      // 1. Direct regex match on entire URL (stops at space/newline/trailing text)
      const regex = /[#?&](?:data|song)=([A-Za-z0-9_\-%+=]+)/;
      const match = href.match(regex);
      if (match && match[1]) {
        let val = match[1];
        if (val.includes('%')) {
          try { val = decodeURIComponent(val); } catch (e) {}
        }
        return val;
      }
      // 2. URLSearchParams fallback
      const hashStr = window.location.hash.replace(/^[#?]/, '');
      const searchStr = window.location.search.replace(/^[#?]/, '');
      const p1 = new URLSearchParams(hashStr);
      const p2 = new URLSearchParams(searchStr);
      let res = p1.get('data') || p1.get('song') || p2.get('data') || p2.get('song');
      if (res && res.includes('%')) {
        try { res = decodeURIComponent(res); } catch (e) {}
      }
      return res;
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2800);
    }

    function renderSharedContent() {
      const b64Data = getRawPayloadString();

      const container = document.getElementById('content-container');

      if (!b64Data) {
        container.innerHTML = `
          <div class="empty-state">
            <div class="empty-icon">🎧</div>
            <h3>No Shared Tracks Found</h3>
            <p style="color: var(--text-muted); margin-top: 8px; font-size: 14px;">
              This link doesn't contain any shared songs or playlist data.
            </p>
            <a href="index.html" class="btn btn-primary" style="margin-top: 20px;">Download Aura Player</a>
          </div>
        `;
        return;
      }

      const data = decodePayload(b64Data);

      if (!data) {
        container.innerHTML = `
          <div class="empty-state">
            <div class="empty-icon">⚠️</div>
            <h3>Unable to Parse Shared Music</h3>
            <p style="color: var(--text-muted); margin-top: 8px; font-size: 14px;">
              The share code is incomplete or malformed.
            </p>
            <div style="display: flex; gap: 10px; justify-content: center; margin-top: 20px; flex-wrap: wrap;">
              <button onclick="location.reload(true)" class="btn btn-primary" style="padding: 10px 20px; font-size: 14px;">
                🔄 Refresh Page
              </button>
              <a href="index.html" class="btn btn-secondary" style="padding: 10px 20px; font-size: 14px;">Go to Home</a>
            </div>
          </div>
        `;
        return;
      }

      const isSingleSong = (data.type === 'song') || (data.tracks && data.tracks.length === 1 && !data.name);
      const title = data.name || (data.tracks && data.tracks[0]?.title) || "Shared Music";
      const tracks = data.tracks || [];
      const trackCount = tracks.length;

      // Deep link URI for app
      const appDeepLink = `auraplayer://share?data=${encodeURIComponent(b64Data)}`;

      let tracksHtml = '';
      tracks.forEach((t, i) => {
        const ytLink = t.yt ? `https://www.youtube.com/watch?v=${t.yt}` : `https://www.youtube.com/results?search_query=${encodeURIComponent(t.title + ' ' + (t.artist || ''))}`;
        tracksHtml += `
          <div class="track-row">
            <span class="track-num">${i + 1}</span>
            <div class="track-info">
              <div class="track-name">${escapeHtml(t.title)}</div>
              <div class="track-artist">${escapeHtml(t.artist || 'Unknown Artist')}</div>
            </div>
            <a href="${ytLink}" target="_blank" rel="noopener" class="track-play-btn" title="Listen on YouTube">
              <svg viewBox="0 0 24 24"><polygon points="8,5 19,12 8,19"/></svg>
            </a>
          </div>
        `;
      });

      container.innerHTML = `
        <div class="playlist-header">
          <div class="playlist-artwork">
            <svg viewBox="0 0 24 24"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg>
          </div>
          <h2 class="playlist-title">${escapeHtml(title)}</h2>
          <div class="playlist-meta">
            <span>${isSingleSong ? '1 Song' : trackCount + ' Songs'}</span>
            <span>•</span>
            <span>Shared from Aura Player</span>
          </div>
        </div>

        <div class="actions-group">
          <a href="${appDeepLink}" class="btn btn-primary" id="btn-open-app">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
              <polygon points="5,3 19,12 5,21"/>
            </svg>
            Open in Aura Player
          </a>

          <button class="btn btn-secondary" onclick="copyTracklist()">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
              <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
              <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
            </svg>
            Copy Tracklist for WhatsApp
          </button>
        </div>

        <div class="tracklist-title">Tracks in this ${isSingleSong ? 'song' : 'playlist'} (${trackCount})</div>
        <div class="tracklist">
          ${tracksHtml}
        </div>
      `;

      // Auto-attempt deep link on mobile devices
      window.sharedTrackData = data;
    }

    function copyTracklist() {
      const data = window.sharedTrackData;
      if (!data || !data.tracks) return;

      const title = data.name || (data.tracks[0]?.title) || "Shared Playlist";
      let text = `🎶 *${title}* (${data.tracks.length} songs)\nShared via Aura Player\n\n`;
      data.tracks.forEach((t, i) => {
        text += `${i + 1}. ${t.title} - ${t.artist}\n`;
      });
      text += `\n📲 Open in Aura Player:\n${window.location.href}`;

      navigator.clipboard.writeText(text).then(() => {
        showToast("Tracklist copied to clipboard!");
      }).catch(() => {
        showToast("Failed to copy tracklist");
      });
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    window.addEventListener('DOMContentLoaded', renderSharedContent);
    window.addEventListener('hashchange', renderSharedContent);
  </script>
</body>
</html>
